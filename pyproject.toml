[project]
name = "adaptive-symbolic-execution"
version = "0.1.0"
description = "Adaptive LLM-Guided Symbolic Execution using Reinforcement Learning for Branch Coverage Maximization"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "klee_installed: requires a real KLEE/LLVM toolchain on PATH",
]
